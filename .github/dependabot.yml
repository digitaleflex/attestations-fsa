# Mises à jour de dépendances automatisées (sécurité + fraîcheur)
# Voir : https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Les montées de version MAJEURE (Prisma 7, Zod 4, TypeScript 7, ESLint 10,
    # Vitest 5…) cassent le build/les tests et exigent une migration planifiée :
    # elles ne doivent pas arriver en PR auto-fusionnable. Mineures/patchs OK.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      production-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
