# =====================================================================
# OpenCode GitHub Agent — intégration officielle (anomalyco/opencode)
# ---------------------------------------------------------------------
# Déclencheurs : commentaire contenant /opencode ou /oc sur une issue
# ou une PR (y compris commentaires ligne par ligne dans l'onglet Files).
#
# Capacités :
#   - /oc summarize              → résume le fil de discussion
#   - /oc explain this issue     → analyse et explique l'issue
#   - /oc fix this               → crée une branche, implémente, ouvre une PR
#   - commentaire sur une ligne  → revue ciblée avec contexte fichier/ligne
#   - commentaire sur une PR     → implémente le changement demandé sur la PR
#
# Setup (une seule fois, ~2 min) :
#   1. Secret "OPENCODE_AUTH_JSON" = contenu de ~/.local/share/opencode/auth.json
#      → Settings → Secrets and variables → Actions → New repository secret
#   2. (Optionnel) Variables du repo :
#      - OPENCODE_MODEL : défaut opencode-go/deepseek-v4.1-flash ;
#        alternative 0 quota : opencode/mimo-v2.6-flash-free
#      - OPENCODE_AGENT : défaut "ci" (défini dans opencode.json, garde-fous inclus)
#
# Garde-fous :
#   - use_github_token : pas de GitHub App à installer, token du workflow.
#   - share: false : aucun contenu de session envoyé à opencode.ai (données utilisateurs).
#   - L'agent "ci" ne peut pas toucher .env*, prisma/migrations/**, secrets,
#     ni faire git push/commit (voir opencode.json).
# =====================================================================
name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Configure git identity
        run: |
          git config user.name "opencode-agent[bot]"
          git config user.email "agent[bot]@users.noreply.github.com"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
          agent: ${{ vars.OPENCODE_AGENT || 'ci' }}
          use_github_token: true
          share: false