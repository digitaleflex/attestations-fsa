name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Quality (tsc + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npx eslint .

  test:
    name: Unit tests + coverage ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Vitest + coverage (ratchet 72/68/77/73)
        run: pnpm test:coverage

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    env:
      E2E_DATABASE_URL: postgresql://attestation_fsa_user:attestation_fsa_password@localhost:5434/attestation_fsa_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start E2E database
        run: docker compose -f compose.local.yml up -d --wait postgres-e2e

      - name: Migrate E2E database
        run: pnpm e2e:db:migrate

      - name: Seed E2E database
        run: pnpm e2e:seed

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Stop E2E database
        if: always()
        run: pnpm e2e:db:down
