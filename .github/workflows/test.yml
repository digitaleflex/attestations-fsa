name: Tests

on:
  push:
  pull_request:

# Lecture seule sur le dépôt (`contents: read`) : ce workflow ne modifie rien.
permissions:
  contents: read

jobs:
  # ── GATE TYPE + LINT ──────────────────────────────────────────────────
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: R2 operations scripts (local, no credentials)
        run: bash scripts/tests/test-r2-scripts.sh

  # ── GATE SÉCURITÉ DES DÉPENDANCES + COUVERTURE ────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit (SCA)
        run: pnpm audit --audit-level=high

      - name: Run tests with coverage
        run: pnpm run test:coverage
