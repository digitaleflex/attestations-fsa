# =====================================================================
# Auto-fix d'issues — autonomie totale
# ---------------------------------------------------------------------
# Une issue labelée "agent" est automatiquement analysée, corrigée,
# testée (pnpm verify) et transformée en PR. Aucune supervision humaine
# avant la PR — l'humain ne fait que relire et merger.
#
# Déclencheurs : issue ouverte AVEC le label "agent", ou label "agent"
# ajouté à une issue existante.
#
# Setup : identique à opencode.yml (secret OPENCODE_AUTH_JSON).
#
# L'action officielle ne publie pas de tag stable vérifiable connu dans ce dépôt ;
# @latest sera remplacé par un SHA immuable dès qu'un SHA publié pourra être vérifié.
# =====================================================================
name: opencode-issues

on:
  issues:
    types: [opened, labeled]

jobs:
  opencode:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'agent')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          # Le workflow pousse la branche après le gate.
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "opencode-agent[bot]"
          git config user.email "agent[bot]@users.noreply.github.com"

      - name: Run OpenCode (auto-fix)
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_AUTH_CONTENT: ${{ secrets.OPENCODE_AUTH_JSON }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode-go/deepseek-v4.1-flash' }}
          agent: ${{ vars.OPENCODE_AGENT || 'ci' }}
          use_github_token: true
          share: false
          prompt: |
            Résous l'issue GitHub suivante (le contexte de l'issue est fourni automatiquement).

            Règles impératives :
            1. Analyse le problème, implémente la correction, écris ou adapte les tests.
            2. Lance `pnpm verify` et corrige jusqu'à ce que tout passe (tsc + eslint + vitest).
            3. Ne touche JAMAIS à : .env*, prisma/migrations/**, fichiers de secrets/clés, .github/workflows/**.
            4. Ne fais AUCUN git push, commit ni création de PR : le workflow s'en charge après le gate.
            5. Termine par un résumé en français : changements, fichiers touchés, tests, points d'attention.

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier les changements produits
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "no_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "no_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Signaler l'absence de changements
        if: steps.changes.outputs.no_changes == 'true'
        run: >-
          gh issue comment "$ISSUE_NUMBER" --body
          "🤖 **Aucun changement produit** par l'agent ; aucune PR ne peut être créée. Logs : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Gate de vérification (pnpm verify)
        if: steps.changes.outputs.no_changes == 'false'
        run: pnpm verify

      - name: Committer, pousser et créer la PR
        if: steps.changes.outputs.no_changes == 'false'
        run: |
          BRANCH="agent/issue-${ISSUE_NUMBER}"
          git checkout -b "$BRANCH"
          git add -A
          git -c user.name="opencode-agent[bot]" -c user.email="agent@users.noreply.github.com" \
            commit -m "fix(agent): résout l'issue #${ISSUE_NUMBER}"
          git push origin "$BRANCH"
          TITLE=$(gh issue view "$ISSUE_NUMBER" --json title --jq '.title')
          gh pr create \
            --base "$DEFAULT_BRANCH" \
            --head "$BRANCH" \
            --title "🤖 fix #${ISSUE_NUMBER}: ${TITLE}" \
            --body "Résout #${ISSUE_NUMBER}. Le gate \`pnpm verify\` (tsc + eslint + vitest) est passé."
