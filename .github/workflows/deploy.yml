name: Deploy to VPS (Docker)

on:
  # Le déploiement suit le workflow CI « Tests » et ne démarre qu'après son succès.
  # workflow_dispatch reste disponible pour une intervention manuelle.
  workflow_run:
    workflows:
      - Tests
    types:
      - completed
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      skip_db:
        description: "Skip database restore"
        required: false
        default: "false"
        type: boolean
      skip_staging:
        description: "Skip staging deployment (emergency only)"
        required: false
        default: "false"
        type: boolean

# Sérialise les déploiements : deux push rapprochés sur main ne doivent JAMAIS
# construire en parallèle sur le même VPS. Incident du 2026-09-17 : 4 builds
# concurrents ont saturé la machine, le build survivant a dépassé le timeout SSH
# et a laissé la production hors ligne ~70 minutes.
# cancel-in-progress: false → on met en file au lieu d'interrompre. Couper un
# `up --build` en cours laisserait le VPS dans un état intermédiaire.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: digitaleflex/attestations-fsa

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # 1. BUILD & PUSH — Construit l'image et la pousse vers GHCR
  # ─────────────────────────────────────────────────────────────────────────
  build-and-push:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_PUSHER_KEY=${{ vars.NEXT_PUBLIC_PUSHER_KEY }}
            NEXT_PUBLIC_PUSHER_CLUSTER=${{ vars.NEXT_PUBLIC_PUSHER_CLUSTER }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}

  # ─────────────────────────────────────────────────────────────────────────
  # 2. DEPLOY STAGING — Déploie sur staging + migrations Prisma
  # ─────────────────────────────────────────────────────────────────────────
  deploy-staging:
    needs: build-and-push
    if: >-
      github.event_name == 'workflow_dispatch' && github.event.inputs.skip_staging != 'true' ||
      github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy to Staging (Docker)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 20m
          script: |
            set -e

            echo "==> 🐳 Starting Staging deployment..."
            cd /home/audest/attestations-fsa

            echo "==> Pulling latest code..."
            git pull origin $(git rev-parse --abbrev-ref HEAD)

            # ── 0. Libérer de l'espace disque ──
            echo "==> Espace disque AVANT nettoyage :"
            df -h / | tail -1
            echo "==> Purge des images inutilisées et du cache de build..."
            docker image prune -af || true
            docker builder prune -af || true
            echo "==> Espace disque APRÈS nettoyage :"
            df -h / | tail -1

            # ── 1. Démarrer la base staging ──
            echo "==> Starting PostgreSQL (staging)..."
            docker compose --env-file .env.staging -f compose.staging.yml up -d fsa-postgres-staging

            echo "==> Waiting for PostgreSQL (staging) to be ready..."
            for i in $(seq 1 30); do
              if docker exec attestations-fsa-postgres-staging \
                pg_isready -U attestation_fsa_staging_user -d attestation_fsa_staging >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            # ── 2. Migrations Prisma sur staging ──
            echo "==> Applying Prisma migrations (staging)..."
            docker compose --env-file .env.staging -f compose.staging.yml --profile tools run --rm prisma-staging

            # ── 3. Déploiement de l'app staging ──
            echo "==> Deploying staging app..."
            docker compose --env-file .env.staging -f compose.staging.yml up -d --wait

            echo "==> Container status:"
            docker compose --env-file .env.staging -f compose.staging.yml ps

            echo "==> HTTP smoke test (staging)..."
            docker compose --env-file .env.staging -f compose.staging.yml \
              exec -T fsa-app-staging wget --no-verbose --tries=1 --spider \
              "http://127.0.0.1:3000/api/ready" >/dev/null

            echo "==> ✅ Staging deployment complete!"

  # ─────────────────────────────────────────────────────────────────────────
  # 3. DEPLOY PROD — Déploie sur prod + migrations Prisma (si staging OK)
  # ─────────────────────────────────────────────────────────────────────────
  deploy-prod:
    needs: [build-and-push, deploy-staging]
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.skip_staging == 'true') ||
      (github.event_name == 'workflow_run' && needs.deploy-staging.result == 'success')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy to Production (Docker)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 30m
          script: |
            set -e

            echo "==> 🐳 Starting Production deployment..."
            cd /home/audest/attestations-fsa

            echo "==> Pulling latest code..."
            git pull origin $(git rev-parse --abbrev-ref HEAD)

            # ── 0. Libérer de l'espace disque (AVANT tout le reste) ──
            echo "==> Espace disque AVANT nettoyage :"
            df -h / | tail -1
            echo "==> Purge des images inutilisées et du cache de build..."
            docker image prune -af || true
            docker builder prune -af || true
            echo "==> Espace disque APRÈS nettoyage :"
            df -h / | tail -1

            SKIP_DB="${{ github.event.inputs.skip_db || 'false' }}"

            # ── 1. Démarrer la base ──
            echo "==> Starting PostgreSQL..."
            docker compose --env-file .env.production -f compose.prod.yml up -d fsa-postgres

            echo "==> Waiting for PostgreSQL to be ready..."
            for i in $(seq 1 30); do
              if docker exec attestations-fsa-postgres-prod \
                pg_isready -U attestation_fsa_user -d attestation_fsa >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            # ── 1.5 BACKUP avant migration (bloquant) ──
            echo "==> Pre-migration backup..."
            BACKUP_DIR=/home/audest/backups/attestation-fsa \
              bash scripts/vps-pre-deploy-backup.sh

            # ── 2. SCHÉMA : migrations Prisma (source de vérité) ──
            echo "==> Applying Prisma migrations (schema)..."
            docker compose --env-file .env.production -f compose.prod.yml --profile tools run --rm prisma migrate deploy

            # ── 3. DONNÉES : injection one-shot du dump SI la base est vide ──
            if [ "$SKIP_DB" != "true" ]; then
              USER_COUNT=$(docker exec attestations-fsa-postgres-prod \
                psql -U attestation_fsa_user -d attestation_fsa -t -c \
                'SELECT COUNT(*) FROM "User";' 2>/dev/null | tr -d ' ' || echo "0")

              if [ "$USER_COUNT" -eq 0 ] 2>/dev/null; then
                if [ -f "Backup/deploy-dump.sql" ]; then
                  echo "==> Database empty. Seeding data from dump..."
                  docker exec -i attestations-fsa-postgres-prod \
                    psql -v ON_ERROR_STOP=1 -U attestation_fsa_user -d attestation_fsa < Backup/deploy-dump.sql
                  echo "==> ✅ Data seeded!"
                else
                  echo "==> ⚠️  No dump found (Backup/deploy-dump.sql). Database stays empty."
                fi
              else
                echo "==> Data already present ($USER_COUNT users). Skipping seed."
              fi
            else
              echo "==> Skipping data seed (skip_db=true)"
            fi

            # ── 4. Déploiement de l'app (image GHCR, pas de build local) ──
            echo "==> Deploying app from GHCR image..."
            IMAGE_TAG="${{ needs.build-and-push.outputs.image_tag }}" \
              docker compose --env-file .env.production -f compose.prod.yml up -d --wait

            echo "==> Container status:"
            docker compose --env-file .env.production -f compose.prod.yml ps

            echo "==> HTTP smoke test..."
            docker compose --env-file .env.production -f compose.prod.yml \
              exec -T fsa-app wget --no-verbose --tries=1 --spider \
              "http://127.0.0.1:3000/api/ready" >/dev/null

            echo "==> ✅ Production deployment complete!"

  # ─────────────────────────────────────────────────────────────────────────
  # 4. ROLLBACK — Si healthcheck prod échoue, revenir au tag précédent
  # ─────────────────────────────────────────────────────────────────────────
  rollback:
    needs: deploy-prod
    if: failure()
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Rollback to previous image
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 10m
          script: |
            set -e

            echo "==> ⚠️  Production healthcheck failed — initiating rollback..."
            cd /home/audest/attestations-fsa

            # Récupérer le tag précédent (l'avant-dernière image)
            PREVIOUS_TAG=$(docker images --format '{{.Tag}}' \
              ghcr.io/digitaleflex/attestations-fsa | grep -v '${{ needs.build-and-push.outputs.image_tag }}' | head -1)

            if [ -z "$PREVIOUS_TAG" ]; then
              echo "==> ❌ No previous image found for rollback!"
              exit 1
            fi

            echo "==> Rolling back to image tag: $PREVIOUS_TAG"
            IMAGE_TAG="$PREVIOUS_TAG" \
              docker compose --env-file .env.production -f compose.prod.yml up -d --wait

            echo "==> Container status after rollback:"
            docker compose --env-file .env.production -f compose.prod.yml ps

            echo "==> HTTP smoke test after rollback..."
            docker compose --env-file .env.production -f compose.prod.yml \
              exec -T fsa-app wget --no-verbose --tries=1 --spider \
              "http://127.0.0.1:3000/api/ready" >/dev/null

            echo "==> ✅ Rollback complete!"
