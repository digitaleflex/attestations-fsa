name: Deploy to VPS (Docker)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      skip_db:
        description: "Skip database restore"
        required: false
        default: "false"
        type: boolean

# Sérialise les déploiements : deux push rapprochés sur main ne doivent JAMAIS
# construire en parallèle sur le même VPS. Incident du 2026-09-17 : 4 builds
# concurrents ont saturé la machine, le build survivant a dépassé le timeout SSH
# et a laissé la production hors ligne ~70 minutes.
# cancel-in-progress: false → on met en file au lieu d'interrompre. Couper un
# `up --build` en cours laisserait le VPS dans un état intermédiaire.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS (Docker)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          # Le défaut est de 10 minutes, insuffisant pour un build Docker complet.
          # Mesuré lors de l'incident du 2026-09-17 : 601 s (10 min pile) atteintes
          # pendant l'export de l'image, build tué, conteneurs déjà arrêtés.
          command_timeout: 30m
          script: |
            set -e

            echo "==> 🐳 Starting Docker deployment..."
            cd /home/audest/attestations-fsa

            echo "==> Pulling latest code..."
            git pull origin $(git rev-parse --abbrev-ref HEAD)

            # ── 0. Libérer de l'espace disque (AVANT tout le reste) ──
            # Le pipeline ne purgeait RIEN : chaque déploiement laissait une
            # image applicative et son cache de build, sans rétention. Sur un
            # VPS à disque réduit, ça finit par saturer.
            # Incident du 2026-09-18 : `ENOSPC: no space left on device` pendant
            # `pnpm build` -> build impossible. Le correctif « pas de down avant
            # up » a évité la panne complète (l'ancien conteneur a continué de
            # servir), mais l'application a brièvement perdu la capacité
            # d'écrire tant que le disque était plein.
            # `-f` : sans confirmation interactive. L'image du conteneur EN
            # COURS n'est jamais supprimée (prune ne touche qu'aux inutilisées).
            echo "==> Espace disque AVANT nettoyage :"
            df -h / | tail -1
            echo "==> Purge des images inutilisées et du cache de build..."
            docker image prune -af || true
            docker builder prune -af || true
            echo "==> Espace disque APRÈS nettoyage :"
            df -h / | tail -1

            SKIP_DB="${{ github.event.inputs.skip_db || 'false' }}"

            # ── 1. Démarrer la base ──
            echo "==> Starting PostgreSQL..."
            docker compose --env-file .env.production -f compose.prod.yml up -d fsa-postgres

            echo "==> Waiting for PostgreSQL to be ready..."
            for i in $(seq 1 30); do
              if docker exec attestations-fsa-postgres-prod \
                pg_isready -U attestation_fsa_user -d attestation_fsa >/dev/null 2>&1; then
                break
              fi
              sleep 2
            done

            # ── 1.5 BACKUP avant migration (bloquant) ──
            echo "==> Pre-migration backup..."
            BACKUP_DIR=/home/audest/backups/attestation-fsa \
              bash scripts/vps-pre-deploy-backup.sh

            # ── 3. SCHÉMA : migrations Prisma (source de vérité) ──
            echo "==> Applying Prisma migrations (schema)..."
            docker compose --env-file .env.production -f compose.prod.yml --profile tools run --rm prisma migrate deploy

            # ── 4. DONNÉES : injection one-shot du dump SI la base est vide ──
            if [ "$SKIP_DB" != "true" ]; then
              USER_COUNT=$(docker exec attestations-fsa-postgres-prod \
                psql -U attestation_fsa_user -d attestation_fsa -t -c \
                'SELECT COUNT(*) FROM "User";' 2>/dev/null | tr -d ' ' || echo "0")

              if [ "$USER_COUNT" -eq 0 ] 2>/dev/null; then
                if [ -f "Backup/deploy-dump.sql" ]; then
                  echo "==> Database empty. Seeding data from dump..."
                  docker exec -i attestations-fsa-postgres-prod \
                    psql -v ON_ERROR_STOP=1 -U attestation_fsa_user -d attestation_fsa < Backup/deploy-dump.sql
                  echo "==> ✅ Data seeded!"
                else
                  echo "==> ⚠️  No dump found (Backup/deploy-dump.sql). Database stays empty."
                fi
              else
                echo "==> Data already present ($USER_COUNT users). Skipping seed."
              fi
            else
              echo "==> Skipping data seed (skip_db=true)"
            fi

            # ── 5. Build & déploiement de l'app ──
            # Volontairement AUCUN `down` préalable : `up -d --build` construit
            # d'abord, PUIS recrée le conteneur. L'ancien continue donc de servir
            # pendant toute la durée du build et seules quelques secondes sont
            # perdues à la bascule. Si le build échoue, l'ancien conteneur survit
            # et la production reste en ligne.
            # Un `down` avant garantissait au contraire plusieurs minutes
            # d'indisponibilité et, en cas d'échec ou d'interruption, laissait la
            # production à terre (incident du 2026-09-17).
            echo "==> Building & starting (attente du healthcheck via --wait)..."
            docker compose --env-file .env.production -f compose.prod.yml up -d --build --wait

            echo "==> Container status:"
            docker compose --env-file .env.production -f compose.prod.yml ps

            echo "==> ✅ Deployment complete!"
