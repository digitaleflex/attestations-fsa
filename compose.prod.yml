# =================================================================
# PROD — FSA Attestations (VPS + Traefik)
# Services aux noms clairs : fsa-app (Next.js) + fsa-postgres (DB)
# Réseaux : proxy (externe, vers Traefik) + backend (privé app<->db, isolé du proxy)
# Volume persistant : fsa-postgres-prod-data (/var/lib/postgresql/data sur VPS)
# Pré-requis VPS : docker network create ${TRAEFIK_NETWORK:-proxy}
# =================================================================
services:
  fsa-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER}
        # #151 — DSN navigateur Sentry (optionnel, vide = désactivé).
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    container_name: attestations-fsa-prod
    hostname: fsa-app
    # Persistance des fichiers uploadés. Sans ces volumes, ils vivent dans la
    # couche d'écriture du conteneur : détruits à chaque recréation (donc à
    # chaque déploiement) et absents de toute sauvegarde — vps-pre-deploy-backup.sh
    # ne fait qu'un pg_dump. Le dump contient les lignes CompositionScan (et leurs
    # url) mais jamais les octets : restaurer produirait des preuves illisibles.
    # Le Dockerfile crée ces dossiers et les cède à l'utilisateur applicatif.
    volumes:
      - fsa-uploads-public:/app/public/uploads
      - fsa-uploads-private:/app/private/uploads
    expose:
      - "3000"
    # Pas de ports publiés : Traefik route via le réseau proxy.
    # Débug direct sans Traefik : décommentez les 2 lignes ci-dessous.
    # ports:
    #   - "${PORT:-3000}:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-proxy}"
      - "traefik.http.routers.fsa-app.rule=Host(`${TRAEFIK_HOST:-hashcode.cloud}`) || Host(`www.${TRAEFIK_HOST:-hashcode.cloud}`)"
      - "traefik.http.routers.fsa-app.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.fsa-app.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.fsa-app.loadbalancer.server.port=3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-attestation_fsa_user}:${POSTGRES_PASSWORD}@fsa-postgres:5432/${POSTGRES_DB:-attestation_fsa}?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_DOMAIN: ${RESEND_DOMAIN}
      EMAIL_FROM: "${EMAIL_FROM:-FSA <noreply@fermestandre.com>}"
      PUSHER_APP_ID: ${PUSHER_APP_ID}
      PUSHER_KEY: ${PUSHER_KEY}
      PUSHER_SECRET: ${PUSHER_SECRET}
      PUSHER_CLUSTER: ${PUSHER_CLUSTER}
      NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY}
      NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN}
      BOTID_SECRET: ${BOTID_SECRET}
      # Scellement HMAC-SHA256 des certificats (#155) — valeur probante
      CERT_SEAL_SECRET: ${CERT_SEAL_SECRET}
      # Plugin admin Better Auth : IDs des utilisateurs promus admin
      ADMIN_USER_IDS: ${ADMIN_USER_IDS}
      # #151 — Observabilité Sentry, OPTIONNELLE. Sans SENTRY_DSN : no-op total,
      # l'application démarre normalement. Le healthcheck /api/health est inchangé.
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0}
    restart: unless-stopped
    depends_on:
      fsa-postgres:
        condition: service_healthy
    networks:
      - proxy
      - backend
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Limites de ressources (hôte mutualisé) + durcissement
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 512
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  fsa-postgres:
    image: postgres:17-alpine
    container_name: attestations-fsa-postgres-prod
    hostname: fsa-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-attestation_fsa_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-attestation_fsa}
    volumes:
      - fsa-postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-attestation_fsa_user} -d ${POSTGRES_DB:-attestation_fsa}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Limites de ressources : hôte mutualisé + shm pour Postgres
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    shm_size: 256mb
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    # DB isolée du proxy : jamais exposée à Traefik, uniquement joignable via backend par fsa-app.
    # Débug local uniquement, ne jamais décommenter sur VPS public :
    # ports:
    #   - "5432:5432"

  # Migrator one-shot : applique les migrations Prisma puis s'arrête.
  # Usage : docker compose -f compose.prod.yml --profile tools run --rm prisma migrate deploy
  prisma:
    build:
      context: .
      dockerfile: Dockerfile.prisma
    container_name: attestations-fsa-prisma-prod
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-attestation_fsa_user}:${POSTGRES_PASSWORD}@fsa-postgres:5432/${POSTGRES_DB:-attestation_fsa}?sslmode=disable
    depends_on:
      fsa-postgres:
        condition: service_healthy
    networks:
      - backend
    profiles:
      - tools
    restart: "no"

networks:
  # Externe, créé par Traefik sur le VPS : docker network create proxy
  # Seul fsa-app y est branché. fsa-postgres reste sur backend uniquement.
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}
  backend:
    driver: bridge
    name: attestations-fsa-backend

volumes:
  # Persistant sur VPS : /var/lib/docker/volumes/attestations-fsa-postgres-prod-data/_data
  # Renommé depuis postgres_prod_data pour clarté — 1ère montée = volume vide,
  # le script deploy-to-vps.sh restaure automatiquement depuis Backup/deploy-dump.sql si base vide.
  fsa-postgres-prod-data:
    driver: local
    name: attestations-fsa-postgres-prod-data

  # Fichiers uploadés — CV/images (public) et scans d'examen (private, la preuve
  # en cas de réclamation, arbitrage #95).
  # Volumes NOMMÉS plutôt que bind mounts : portables entre machines, et leur
  # propriété est initialisée depuis l'image au premier montage (le Dockerfile
  # cède ces dossiers à l'utilisateur applicatif uid 1001).
  # ⚠️ Ces volumes ne sont PAS couverts par vps-pre-deploy-backup.sh (qui ne
  # fait qu'un pg_dump) : leur sauvegarde reste à traiter — voir la conception
  # de cohérence (PR docs-coherence-migration).
  fsa-uploads-public:
    driver: local
    name: attestations-fsa-uploads-public
  fsa-uploads-private:
    driver: local
    name: attestations-fsa-uploads-private
